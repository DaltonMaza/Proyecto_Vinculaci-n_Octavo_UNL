<!doctype html>
<html>
    <head>
        <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
        <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>
    </head>

    <body style="margin: 0; overflow: hidden;">
        <a-scene
            vr-mode-ui="enabled: false;"
            loading-screen="enabled: false;"
            renderer="logarithmicDepthBuffer: true;"
            arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
            id="scene"
            embedded
            gesture-detector
        >
            <a-assets>
                <a-asset-item id="modelo1" src="assets/modelo1.glb"></a-asset-item>
                <a-asset-item id="modelo2" src="assets/modelo2.glb"></a-asset-item>
                <a-asset-item id="modelo3" src="assets/modelo3.glb"></a-asset-item>
                <a-asset-item id="modelo4" src="assets/modelo4.glb"></a-asset-item>
                <a-asset-item id="modelo5" src="assets/modelo5.glb"></a-asset-item>
            </a-assets>

            <a-marker
                id="marcador1"
                type="pattern"
                preset="custom"
                url="assets/pattern-marcador1.patt"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
            >
                <a-entity
                    id="entity-modelo1"
                    position="0 0 0"
                    scale="2 2 2"
                    animation-mixer="loop: repeat"
                    gltf-model="#modelo1"
                    class="clickable"
                    gesture-handler
                ></a-entity>
            </a-marker>

            <a-marker
                id="marcador2"
                type="pattern"
                preset="custom"
                url="assets/pattern-marcador2.patt"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
            >
                <a-entity
                    id="entity-modelo2"
                    position="0 0 0"
                    scale="2 2 2"
                    animation-mixer="loop: repeat"
                    gltf-model="#modelo2"
                    class="clickable"
                    gesture-handler
                ></a-entity>
            </a-marker>

            <a-marker
                id="marcador3"
                type="pattern"
                preset="custom"
                url="assets/pattern-marcador3.patt"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
            >
                <a-entity
                    id="entity-modelo3"
                    position="0 0 0"
                    scale="2 2 2"
                    animation-mixer="loop: repeat"
                    gltf-model="#modelo3"
                    class="clickable"
                    gesture-handler
                ></a-entity>
            </a-marker>

            <a-marker
                id="marcador4"
                type="pattern"
                preset="custom"
                url="assets/pattern-marcador4.patt"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
            >
                <a-entity
                    id="entity-modelo4"
                    position="0 0 0"
                    scale="2 2 2"
                    animation-mixer="loop: repeat"
                    gltf-model="#modelo4"
                    class="clickable"
                    gesture-handler
                ></a-entity>
            </a-marker>

            <a-marker
                id="marcador5"
                type="pattern"
                preset="custom"
                url="assets/pattern-marcador5.patt"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
            >
                <a-entity
                    id="entity-modelo5"
                    position="0 0 0"
                    scale="2 2 2"
                    animation-mixer="loop: repeat"
                    gltf-model="#modelo5"
                    class="clickable"
                    gesture-handler
                ></a-entity>
            </a-marker>

            <a-entity camera></a-entity>
        </a-scene>
    </body>
</html>
