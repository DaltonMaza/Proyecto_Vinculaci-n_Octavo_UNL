<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS -->
    <link rel="stylesheet" href="css/styles.css">

    <!-- Librerías AR.js / A-Frame -->
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
    <script
        src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
    <script
        src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">
    <div id="category-selector">
        <button data-cat="zap" class="cat-btn active">Zapatos</button>
        <button data-cat="com" class="cat-btn">Comida</button>
        <!-- <button data-cat="maq" class="cat-btn">Maquillaje</button> -->
    </div>

    <a-scene vr-mode-ui="enabled: false;" loading-screen="enabled: false;" renderer="logarithmicDepthBuffer: true;"
        arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;" id="scene" embedded gesture-detector>
        <a-assets>
            <!-- Categoría: Zapatos -->
            <a-asset-item id="zap-1" src="assets/modelos3D/zapatos_m1.glb"></a-asset-item>
            <a-asset-item id="zap-2" src="assets/modelos3D/zapatos_m2.glb"></a-asset-item>
            <a-asset-item id="zap-3" src="assets/modelos3D/zapatos_m3.glb"></a-asset-item>
            <a-asset-item id="zap-4" src="assets/modelos3D/zapatos_m4.glb"></a-asset-item>
            <a-asset-item id="zap-5" src="assets/modelos3D/zapatos_m5.glb"></a-asset-item>

            <!-- Categoría: Comida típica -->
            <a-asset-item id="com-1" src="assets/modelos3D/comida_m1.glb"></a-asset-item>
            <a-asset-item id="com-2" src="assets/modelos3D/comida_m2.glb"></a-asset-item>
            <a-asset-item id="com-3" src="assets/modelos3D/comida_m3.glb"></a-asset-item>
            <a-asset-item id="com-4" src="assets/modelos3D/comida_m4.glb"></a-asset-item>
            <a-asset-item id="com-5" src="assets/modelos3D/comida_m5.glb"></a-asset-item>

            <!-- Categoría: Maquillaje -->
            <a-asset-item id="maq-1" src="assets/modelos3D/maquillaje_m1.glb"></a-asset-item>
            <a-asset-item id="maq-2" src="assets/modelos3D/maquillaje_m2.glb"></a-asset-item>
            <a-asset-item id="maq-3" src="assets/modelos3D/maquillaje_m3.glb"></a-asset-item>
            <a-asset-item id="maq-4" src="assets/modelos3D/maquillaje_m4.glb"></a-asset-item>
            <a-asset-item id="maq-5" src="assets/modelos3D/maquillaje_m5.glb"></a-asset-item>
        </a-assets>

        <a-marker id="marcador1" type="pattern" preset="custom" url="assets/marcadores/pattern-marcador1.patt"
            raycaster="objects: .clickable" emitevents="true" cursor="fuse: false; rayOrigin: mouse;">
            <a-entity id="modelo1" gltf-model="#zap-1" position="0 0 0" scale="1 1 1" animation-mixer="loop: repeat"
                class="clickable" gesture-handler></a-entity>
        </a-marker>

        <a-marker id="marcador2" type="pattern" preset="custom" url="assets/marcadores/pattern-marcador2.patt"
            raycaster="objects: .clickable" emitevents="true" cursor="fuse: false; rayOrigin: mouse;">
            <a-entity id="modelo2" gltf-model="#zap-2" position="0 0 0" scale="1 1 1" animation-mixer="loop: repeat"
                class="clickable" gesture-handler></a-entity>
        </a-marker>

        <a-marker id="marcador3" type="pattern" preset="custom" url="assets/marcadores/pattern-marcador3.patt"
            raycaster="objects: .clickable" emitevents="true" cursor="fuse: false; rayOrigin: mouse;">
            <a-entity id="modelo3" gltf-model="#zap-3" position="0 0 0" scale="1 1 1" animation-mixer="loop: repeat"
                class="clickable" gesture-handler></a-entity>
        </a-marker>

        <a-marker id="marcador4" type="pattern" preset="custom" url="assets/marcadores/pattern-marcador4.patt"
            raycaster="objects: .clickable" emitevents="true" cursor="fuse: false; rayOrigin: mouse;">
            <a-entity id="modelo4" gltf-model="#zap-4" position="0 0 0" scale="1 1 1" animation-mixer="loop: repeat"
                class="clickable" gesture-handler></a-entity>
        </a-marker>

        <a-marker id="marcador5" type="pattern" preset="custom" url="assets/marcadores/pattern-marcador5.patt"
            raycaster="objects: .clickable" emitevents="true" cursor="fuse: false; rayOrigin: mouse;">
            <a-entity id="modelo5" gltf-model="#zap-5" position="0 0 0" scale="1 1 1" animation-mixer="loop: repeat"
                class="clickable" gesture-handler></a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script src="js/categorias.js"></script>
    
</body>

</html>
